name: Criar APK Direto

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar codigo
      uses: actions/checkout@v4

    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Instalar dependências
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Definir appId unico
      run: |
        for f in capacitor.config.json capacitor.config.ts; do
          if [ -f "$f" ]; then
            sed -i -E 's/"appId": *"[^"]*"/"appId": "com.gkdmobility.mensseger"/; s/appId: *"[^"]*"/appId: "com.gkdmobility.mensseger"/' "$f"
            grep -n "appId" "$f" || true
          fi
        done

    - name: Configurar Capacitor e Android
      run: |
        npx cap add android || true
        npm run apply-icons || true
        npx cap sync android

    - name: Forcar minSdk 22
      run: |
        sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 22/' android/variables.gradle || true
        sed -i -E 's/minSdkVersion +[0-9]+/minSdkVersion 22/' android/app/build.gradle || true
        grep -rn "minSdk" android/variables.gradle android/app/build.gradle || true

    - name: Forçar ícone personalizado
      run: |
        RES=android/app/src/main/res
        ls -la public/
        rm -rf $RES/mipmap-anydpi-v26
        rm -f $RES/drawable-v24/ic_launcher_foreground.xml
        npm run apply-icons || true
        ls -la $RES/mipmap-hdpi/

    - name: Decodificar Keystore Fixa a partir do Segredo
      run: |
        if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore
          ls -la release.keystore
        else
          echo "Segredo DEBUG_KEYSTORE_BASE64 não encontrado"
        fi

    - name: Configurar Keystore Fixo para Assinatura Consistente
      run: |
        mkdir -p ~/.android
        if [ -f "release.keystore" ]; then
          cp release.keystore ~/.android/debug.keystore
        fi

    - name: Forçar signingConfig do App para Usar o Keystore Fixo
      run: |
        if [ -f "$HOME/.android/debug.keystore" ]; then
          if grep -q "android.signingConfigs.debug.storeFile" android/app/build.gradle; then
            echo "signingConfig já estava forçado"
            exit 0
          fi
          echo 'android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.storePassword = "android"' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.keyAlias = "androiddebugkey"' >> android/app/build.gradle
          echo 'android.signingConfigs.debug.keyPassword = "android"' >> android/app/build.gradle
          echo 'android.buildTypes.debug.signingConfig = android.buildTypes.debug' >> android/app/build.gradle
          echo "signingConfig forçado"
        else
          echo "release.keystore não disponível"
        fi

    - name: Compilar APK (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Verificar Fingerprint da Assinatura do APK
      continue-on-error: true
      run: |
        SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
        APK=android/app/build/outputs/apk/debug/app-debug.apk
        APKSIGNER=$(ls $SDK/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
        if [ -z "$APKSIGNER" ]; then
          echo "apksigner nao encontrado - pulando verificacao"
          exit 0
        fi
        "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256\|SHA-1"

    - name: Guardar o APK
      uses: actions/upload-artifact@v4
      with:
        name: Mensseger-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
